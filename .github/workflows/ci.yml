name: CI de calidad

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Puerta de calidad: si alguna prueba falla o la cobertura de src/
      # es menor al 80 %, el job termina en rojo y el cambio no se acepta.
      - name: Pruebas y cobertura (puerta de calidad)
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80
